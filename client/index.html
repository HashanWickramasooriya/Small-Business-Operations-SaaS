<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BusinessOS — Run your business. Control your operations. Grow with confidence.</title>
    <meta
      name="description"
      content="BusinessOS is the small business operations platform for inventory, sales, customers, suppliers, expenses, and reporting — all in one place."
    />
    <meta property="og:title" content="BusinessOS" />
    <meta property="og:description" content="Run your business. Control your operations. Grow with confidence." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var stored = localStorage.getItem("businessos-theme");
        var theme = stored || "system";
        var isDark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
